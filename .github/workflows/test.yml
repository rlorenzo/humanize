name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest pytest-cov
      - name: Test with coverage floor
        run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=85

  lint:
    name: lint and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff pylint vulture

      - name: Ruff lint (includes C901 complexity)
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .

      - name: Dead code
        run: vulture humanize_anti_slop tests --min-confidence 80

      - name: Duplicate code
        run: pylint --disable=all --enable=duplicate-code --min-similarity-lines=6 humanize_anti_slop tests

      # shellcheck is preinstalled on ubuntu-latest. bash -n only catches syntax
      # errors; shellcheck catches quoting and portability bugs, which matter
      # because the hook runs on macOS bash 3.2 as well.
      - name: Shell lint
        run: |
          bash -n hooks/humanize-post-write.sh install.sh .github/smoke-console-scripts.sh
          shellcheck hooks/humanize-post-write.sh install.sh .github/smoke-console-scripts.sh

  package:
    name: wheel installs and console scripts run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install build

      - name: Build wheel
        run: python -m build --wheel

      # Guards the entry points: they referenced modules the wheel did not ship
      # until v1.1.1, so `humanize-score` died with ModuleNotFoundError on install.
      # Both install modes are exercised, because the first attempt at this fix
      # worked from a wheel and still left the editable install broken.
      - name: Wheel install runs both console scripts
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --quiet dist/*.whl
          ./.github/smoke-console-scripts.sh /tmp/wheel-venv

      - name: Editable install runs both console scripts
        run: |
          python -m venv /tmp/edit-venv
          /tmp/edit-venv/bin/pip install --quiet -e .
          ./.github/smoke-console-scripts.sh /tmp/edit-venv
