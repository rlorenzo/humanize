[project]
name = "humanize-anti-slop"
# Keep version in sync with .claude-plugin/plugin.json and SKILL.md metadata.version.
version = "1.1.1"
description = "Anti-slop framework for Claude Code: skill + scorer + agent + hook. Domain-aware AI-writing pattern detection. Extends blader/humanizer."
authors = [
    {name = "Kimal Honour Djam", email = "kimhons@gmail.com"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Libraries",
]
keywords = ["claude-code", "humanizer", "ai-slop", "writing-quality", "academic-writing"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[project.urls]
Homepage = "https://github.com/kimhons/humanize"
Issues = "https://github.com/kimhons/humanize/issues"
Documentation = "https://github.com/kimhons/humanize/blob/main/README.md"

[project.scripts]
humanize-score = "humanize_anti_slop.humanize_score:main"
burstiness-check = "humanize_anti_slop.burstiness_check:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["humanize_anti_slop"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
# C90 = mccabe complexity. The codebase tops out at 8 (score_text); 10 leaves
# headroom while still catching a function that grows a new decision tree.
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C90"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["humanize_anti_slop"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
